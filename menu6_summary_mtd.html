<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>6. Summary MTD (SPV)</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center shadow-md">
        <span class="font-black text-blue-400">📊 6. SUMMARY MTD MATRIX SPV</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-6xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-6">
            <h3 class="text-xs font-black uppercase text-slate-700 tracking-wider">📊 Matriks Infografis Capaian Kategori Tim Per Supervisor</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="chartsGridContainer">
                <!-- Komponen grafik lingkaran per SPV akan dibangun otomatis oleh javascript di sini -->
            </div>
        </div>
        <div class="text-center"><a href="index.html" class="text-xs text-slate-400 font-bold">&larr; Kembali ke Dashboard</a></div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let dbEmp = JSON.parse(localStorage.getItem('MDS_EMPLOYEE_MASTER_DATABASE')) || [];
            let dbKpi = JSON.parse(localStorage.getItem('MDS_KPI_HARIAN_STORAGE_DATABASE')) || {};
            let grid = document.getElementById('chartsGridContainer');

            let salesMap = {};
            Object.keys(dbKpi).forEach(date => {
                dbKpi[date].forEach(row => {
                    let parts = row.particulars.split('-');
                    salesMap[parts[0].trim()] = (salesMap[parts[0].trim()] || 0) + (row.netSales || 0);
                });
            });

            // Kelompokkan data sebaran kategori Diamond/Gold/Silver/Stone berdasarkan nama SPV
            let spvStats = {};
            dbEmp.forEach(emp => {
                let actual = salesMap[emp.id] || 0;
                let target = parseInt(emp.masa) * 1421833 || 25000000;
                let ach = target > 0 ? (actual / target) * 100 : 0;
                
                let cat = "Stone";
                if(ach >= 100) cat = "Diamond";
                else if(ach >= 80) cat = "Gold";
                else if(ach >= 50) cat = "Silver";

                if(!spvStats[emp.spv]) spvStats[emp.spv] = { Diamond: 0, Gold: 0, Silver: 0, Stone: 0 };
                spvStats[emp.spv][cat]++;
            });

            let spvKeys = Object.keys(spvStats);
            if(spvKeys.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs italic">Belum ada sebaran tim Supervisor untuk dikonversi menjadi diagram lingkaran.</div>`;
                return;
            }

            spvKeys.forEach((spvName, index) => {
                let block = document.createElement('div');
                block.className = "bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center space-y-3 shadow-sm";
                block.innerHTML = `
                    <h4 class="text-xs font-black uppercase text-slate-700 tracking-wide border-b border-slate-200 pb-1.5">${spvName}</h4>
                    <div class="w-full max-w-[160px] mx-auto"><canvas id="chartCanvas-${index}"></canvas></div>
                `;
                grid.appendChild(block);

                // Render Chart.js Doughnut Graphic Component
                new Chart(document.getElementById(`chartCanvas-${index}`).getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Diamond', 'Gold', 'Silver', 'Stone'],
                        datasets: [{
                            data: [spvStats[spvName].Diamond, spvStats[spvName].Gold, spvStats[spvName].Silver, spvStats[spvName].Stone],
                            backgroundColor: ['#059669', '#fbbf24', '#cbd5e1', '#f43f5e']
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            });
        });
    </script>
</body>
</html>

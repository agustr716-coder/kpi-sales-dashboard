<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>8. Performance Rank MTD</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center shadow-md">
        <span class="font-black text-amber-400">👑 8. GLOBAL LEADERBOARD RANK MTD</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-6xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-xs font-black uppercase text-slate-700 tracking-wider">👑 Papan Klasemen Utama Juara Omset Nasional Global Tim Sales</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-800 text-white font-bold uppercase">
                        <tr><th class="p-2.5">Rank</th><th class="p-2.5">Divisi</th><th class="p-2.5">Employee ID</th><th class="p-2.5">Nama Lengkap</th><th class="p-2.5">Supervisor</th><th class="p-2.5 text-right">Total Nominal MTD</th></tr>
                    </thead>
                    <tbody id="tbodyGlobalLeaderboard" class="divide-y divide-slate-100 font-semibold text-slate-700"></tbody>
                </table>
            </div>
        </div>
        <div class="text-center"><a href="index.html" class="text-xs text-slate-400 font-bold">&larr; Kembali ke Dashboard</a></div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let dbEmp = JSON.parse(localStorage.getItem('MDS_EMPLOYEE_MASTER_DATABASE')) || [];
            let dbKpi = JSON.parse(localStorage.getItem('MDS_KPI_HARIAN_STORAGE_DATABASE')) || {};
            let tbody = document.getElementById('tbodyGlobalLeaderboard');
            let fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

            let salesMap = {};
            Object.keys(dbKpi).forEach(date => {
                dbKpi[date].forEach(row => {
                    let parts = row.particulars.split('-');
                    salesMap[parts[0].trim()] = (salesMap[parts[0].trim()] || 0) + (row.netSales || 0);
                });
            });

            // Petakan payload total omset berjalan
            let boardList = dbEmp.map(emp => {
                return {
                    id: emp.id,
                    name: emp.name,
                    div: emp.div,
                    spv: emp.spv,
                    totalValue: salesMap[emp.id] || 0
                };
            }).sort((a,b) => b.totalValue - a.totalValue); // Sorting descending nominal order rule

            if(boardList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 italic">Belum ada tim terdaftar.</td></tr>`;
                return;
            }

            boardList.forEach((sales, idx) => {
                let highlightClass = idx === 0 ? "bg-amber-50 text-amber-900 font-black border-l-4 border-amber-500" : "";
                let tr = document.createElement('tr');
                tr.className = highlightClass;
                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-slate-600">🏆 Juara ${idx + 1}</td>
                    <td class="p-2.5 font-black text-blue-600 uppercase">Divisi ${sales.div}</td>
                    <td class="p-2.5 font-mono text-slate-400">${sales.id}</td>
                    <td class="p-2.5 text-slate-900">${sales.name}</td>
                    <td class="p-2.5 text-slate-500">${sales.spv}</td>
                    <td class="p-2.5 text-right font-black text-emerald-600">${fmt.format(sales.totalValue)}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>

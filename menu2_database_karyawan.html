<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>2. Database Karyawan</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center">
        <span class="font-black text-blue-400">👥 2. DATABASE KARYAWAN</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-5xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border shadow-sm space-y-4">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl text-xs font-semibold">
                <input type="text" id="empId" placeholder="NIK Karyawan" class="p-2 border rounded-xl bg-white focus:outline-none" />
                <input type="text" id="empName" placeholder="Nama Lengkap Karyawan" class="p-2 border rounded-xl bg-white focus:outline-none" />
                <select id="empDiv" class="p-2 border rounded-xl bg-white"><option>1</option><option>2</option><option>3</option><option>4</option><option>SA</option><option>KASIR</option></select>
                <select id="empSpv" class="p-2 border rounded-xl bg-white"><option>SRI WULANDARI</option><option>JERNI SANARIA</option><option>EKO PUTRA SETIAWAN</option><option>NURLINAWATI</option></select>
                <select id="empMasa" class="p-2 border rounded-xl bg-white col-span-2">
                    <script>
                        for(let i=1; i<=26; i++) document.write(`<option value="${i} Hari Kerja">${i} Hari Kerja</option>`);
                    </script>
                </select>
                <button onclick="addEmp()" class="bg-blue-600 text-white font-bold rounded-xl py-2 col-span-2 cursor-pointer">➕ Tambah Manual</button>
            </div>
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-800 text-white font-bold uppercase"><tr><th class="p-2">Masa Kerja</th><th class="p-2">Div</th><th class="p-2">Employee ID</th><th class="p-2">Employee Name</th><th class="p-2">SPV</th><th class="p-2 text-center">Aksi</th></tr></thead>
                <tbody id="empList" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>
    <script>
        let dbEmp = JSON.parse(localStorage.getItem('MDS_EMPLOYEE_MASTER_DATABASE')) || [];
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('MDS_ADMIN_LOGGED_IN') !== 'true') { alert("Akses Ditolak!"); window.location.href="index.html"; }
            renderTable();
        });
        function addEmp() {
            let id = document.getElementById('empId').value.trim();
            let name = document.getElementById('empName').value.trim();
            let div = document.getElementById('empDiv').value;
            let spv = document.getElementById('empSpv').value;
            let masa = document.getElementById('empMasa').value;
            if(!id || !name) return alert("Lengkapi NIK & Nama!");
            dbEmp.push({ masa, prefix: "CV", div, id, name, spv });
            localStorage.setItem('MDS_EMPLOYEE_MASTER_DATABASE', JSON.stringify(dbEmp));
            document.getElementById('empId').value = ""; document.getElementById('empName').value = "";
            renderTable();
        }
        function deleteEmp(i) { dbEmp.splice(i, 1); localStorage.setItem('MDS_EMPLOYEE_MASTER_DATABASE', JSON.stringify(dbEmp)); renderTable(); }
        function renderTable() {
            let tbody = document.getElementById('empList'); tbody.innerHTML = "";
            dbEmp.forEach((emp, i) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-2 font-bold">${emp.masa}</td><td class="p-2 font-black">${emp.div}</td><td class="p-2 font-mono">${emp.id}</td><td class="p-2 font-bold">${emp.name}</td><td class="p-2">${emp.spv}</td><td class="p-2 text-center"><button onclick="deleteEmp(${i})" class="text-red-500 font-bold">Hapus</button></td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>

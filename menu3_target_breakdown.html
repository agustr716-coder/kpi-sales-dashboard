<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>3. Target Breakdown</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center">
        <span class="font-black text-amber-400">🎯 3. TARGET BREAKDOWN SYSTEM</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-6xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-slate-900 text-white p-6 rounded-3xl grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
            <div>
                <label class="block text-[10px] text-slate-400 font-bold">PERIODE KALENDER:</label>
                <select id="period" class="w-full text-xs p-2 bg-slate-800 border border-slate-700 rounded-xl text-white font-bold"><option value="2026-11">November 2026</option><option value="2026-12">Desember 2026</option></select>
            </div>
            <div>
                <label class="block text-[10px] text-slate-400 font-bold">SALES BULAN LALU (LY):</label>
                <input type="number" id="lyField" value="3319332937" class="w-full text-xs p-2 bg-slate-800 border border-slate-700 text-amber-400 font-black rounded-xl" />
            </div>
            <div class="p-2 bg-slate-800 rounded-xl border border-slate-700 text-center">
                <span class="text-[9px] text-slate-400 block uppercase font-bold">Target Baru (+10%):</span>
                <span class="text-xs font-black text-emerald-400" id="up10Val">Rp 3.651.266.231</span>
            </div>
            <button onclick="saveTarget()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2.5 rounded-xl text-xs transition shadow">💾 Simpan Target</button>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm text-center text-xs text-slate-400">Ubah nominal angka Sales LY di atas, lalu klik Simpan Target untuk mendistribusikan nominal rupiah porsi kerja tim secara otomatis lintas database.</div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('MDS_ADMIN_LOGGED_IN') !== 'true') { alert("Akses Ditolak!"); window.location.href="index.html"; }
            document.getElementById('lyField').addEventListener('input', () => {
                let ly = parseFloat(document.getElementById('lyField').value) || 0;
                let up10 = Math.round(ly * 1.10);
                document.getElementById('up10Val').textContent = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(up10);
            });
        });
        function saveTarget() {
            let activePeriod = document.getElementById('period').value;
            let ly = parseFloat(document.getElementById('lyField').value) || 0;
            let up10 = Math.round(ly * 1.10);
            let dbTarget = JSON.parse(localStorage.getItem('MDS_TARGET_DATABASE_BY_MONTH')) || {};
            dbTarget[activePeriod] = { lyValue: ly, calculatedUp10: up10 };
            localStorage.setItem('MDS_TARGET_DATABASE_BY_MONTH', JSON.stringify(dbTarget));
            alert(`Sukses mengunci alokasi target porsi periode [${activePeriod}] di cloud database!`);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>7. Performance Divisi</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center shadow-md">
        <span class="font-black text-amber-400">🛡️ 7. CLUSTER PERFORMANCE BY DIVISI</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-4xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-xs font-black uppercase text-slate-700 tracking-wider">🛡️ Papan Akumulasi Rangking Kontribusi Omset Rumpun Divisi</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-800 text-white font-bold uppercase">
                        <tr><th class="p-2.5">Peringkat</th><th class="p-2.5">Cluster Divisi</th><th class="p-2.5 text-right">Total Akumulasi Penjualan MTD</th></tr>
                    </thead>
                    <tbody id="tbodyDivisiRank" class="divide-y divide-slate-100 font-semibold text-slate-700"></tbody>
                </table>
            </div>
        </div>
        <div class="text-center"><a href="index.html" class="text-xs text-slate-400 font-bold">&larr; Kembali ke Dashboard</a></div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let dbEmp = JSON.parse(localStorage.getItem('MDS_EMPLOYEE_MASTER_DATABASE')) || [];
            let dbKpi = JSON.parse(localStorage.getItem('MDS_KPI_HARIAN_STORAGE_DATABASE')) || {};
            let tbody = document.getElementById('tbodyDivisiRank');
            let fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

            let salesMap = {};
            Object.keys(dbKpi).forEach(date => {
                dbKpi[date].forEach(row => {
                    let parts = row.particulars.split('-');
                    salesMap[parts[0].trim()] = (salesMap[parts[0].trim()] || 0) + (row.netSales || 0);
                });
            });

            // Akumulasikan nominal rupiah per divisi kerja staf
            let divSales = { "1":0, "2":0, "3":0, "4":0, "SA":0, "SU":0, "KASIR":0, "MAGANG":0 };
            dbEmp.forEach(emp => {
                let divCode = emp.div || "1";
                if(divSales[divCode] !== undefined) {
                    divSales[divCode] += (salesMap[emp.id] || 0);
                }
            });

            // Urutkan peringkat divisi dari omset nominal terbesar
            let sortedDivs = Object.keys(divSales).map(k => {
                return { key: k, total: divSales[k] };
            }).sort((a,b) => b.total - a.total);

            sortedDivs.forEach((d, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-slate-500">Peringkat ${index + 1}</td>
                    <td class="p-2.5 font-black uppercase text-slate-900">Rumpun Divisi ${d.key}</td>
                    <td class="p-2.5 text-right font-black text-blue-600">${fmt.format(d.total)}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>1. Input KPI Sales Person</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center">
        <span class="font-black text-blue-400">📥 1. INPUT KPI SALES PERSON</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-4xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl space-y-3">
                    <input type="date" id="kpiDate" class="w-full text-xs px-3 py-2 border rounded-xl bg-white" />
                    <input type="file" id="kpiFile" accept=".xlsx, .xls" class="block w-full text-xs border rounded-xl bg-white p-1" />
                    <button onclick="saveKpiData()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-xs">💾 Simpan Permanen Hari Ini</button>
                </div>
                <div class="bg-slate-900 text-slate-300 p-4 rounded-xl text-xs space-y-2">
                    <span class="text-amber-400 block font-bold">☁️ Google Webhook Link Active:</span>
                    <input type="text" id="webhook" value="https://google.com" class="w-full p-2 bg-slate-800 border border-slate-700 rounded-xl" readonly />
                    <div id="statusTxt" class="font-bold">Total tersimpan: 0 Tanggal</div>
                </div>
            </div>
            <div id="badges" class="flex flex-wrap gap-2 p-4 bg-slate-50 border rounded-xl min-h-12 items-center"></div>
        </div>
        <div class="text-center"><a href="index.html" class="text-xs text-slate-400 font-bold">&larr; Kembali ke Dashboard</a></div>
    </main>
    <script>
        let db = JSON.parse(localStorage.getItem('MDS_KPI_HARIAN_STORAGE_DATABASE')) || {};
        let currentRows = null;
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('MDS_ADMIN_LOGGED_IN') !== 'true') { alert("Akses Ditolak!"); window.location.href="index.html"; }
            document.getElementById('kpiDate').value = new Date().toISOString().split('T')[0];
            renderBadges();
            document.getElementById('kpiFile').addEventListener('change', (e) => {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    let raw = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                    let parsed = [];
                    for(let i=1; i<raw.length; i++) { if(raw[i][1]) parsed.push({ particulars: String(raw[i][1]), netSales: parseFloat(raw[i][3])||0 }); }
                    currentRows = parsed;
                    document.getElementById('statusTxt').textContent = `🟢 Terdeteksi: ${parsed.length} baris data siap simpan.`;
                };
                reader.readAsArrayBuffer(e.target.files[0]);
            });
        });
        function saveKpiData() {
            let dt = document.getElementById('kpiDate').value;
            if(!dt || !currentRows) return alert("Pilih tanggal dan file Excel!");
            db[dt] = currentRows;
            localStorage.setItem('MDS_KPI_HARIAN_STORAGE_DATABASE', JSON.stringify(db));
            fetch(document.getElementById('webhook').value, { method: "POST", mode: "no-cors", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ savedDate: dt, kpiData: currentRows }) }).catch(e=>console.log(e));
            alert(`Sukses menyimpan data tanggal [${dt}]!`);
            currentRows = null; renderBadges();
        }
        function renderBadges() {
            let keys = Object.keys(db).sort();
            document.getElementById('statusTxt').textContent = `Total riwayat tersimpan: ${keys.length} Tanggal`;
            let container = document.getElementById('badges');
            container.innerHTML = keys.length === 0 ? '<span class="text-xs text-slate-400 italic">Database kosong.</span>' : '';
            keys.forEach(k => {
                let div = document.createElement('div');
                div.className = "bg-slate-900 text-white text-xs px-3 py-1 rounded-xl flex items-center gap-2";
                div.innerHTML = `<span>📅 ${k} (${db[k].length} Baris)</span>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>

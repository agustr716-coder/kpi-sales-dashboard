<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>9. Rank By Day Perorang</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center shadow-md">
        <span class="font-black text-blue-400">⚡ 9. RUNNING DAILY RANK PER SALES PERSON</span>
        <a href="index.html" class="bg-slate-800 text-amber-400 text-xs px-4 py-2 rounded-xl border border-slate-700 font-bold">🏠 Home Dashboard</a>
    </nav>
    <main class="max-w-4xl mx-auto p-6 mt-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-xs font-black uppercase text-slate-700 tracking-wider">⚡ Analisis Efisiensi Peringkat Produktivitas Omset Harian</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="bg-slate-800 text-white font-bold uppercase">
                        <tr><th class="p-2.5">Nama Karyawan</th><th class="p-2.5">Divisi</th><th class="p-2.5 text-right">Rata-Rata Omset/Hari Kerja</th><th class="p-2.5 text-center">Status Keaktifan</th></tr>
                    </thead>
                    <tbody id="tbodyDailyEfficiency" class="divide-y divide-slate-100 font-semibold text-slate-700"></tbody>
                </table>
            </div>
        </div>
        <div class="text-center"><a href="index.html" class="text-xs text-slate-400 font-bold">&larr; Kembali ke Dashboard</a></div>
    </main>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let dbEmp = JSON.parse(localStorage.getItem('MDS_EMPLOYEE_MASTER_DATABASE')) || [];
            let dbKpi = JSON.parse(localStorage.getItem('MDS_KPI_HARIAN_STORAGE_DATABASE')) || {};
            let tbody = document.getElementById('tbodyDailyEfficiency');
            let fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

            let salesMap = {};
            Object.keys(dbKpi).forEach(date => {
                dbKpi[date].forEach(row => {
                    let parts = row.particulars.split('-');
                    salesMap[parts[0].trim()] = (salesMap[parts[0].trim()] || 0) + (row.netSales || 0);
                });
            });

            dbEmp.forEach(emp => {
                let totalActual = salesMap[emp.id] || 0;
                let activeDaysCount = parseInt(emp.masa) || 26;
                let averagePerDay = totalActual / activeDaysCount; // Rumus pembagian efisiensi hari kerja retail

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-slate-900">${emp.name}</td>
                    <td class="p-2.5 uppercase text-slate-400">Grup Divisi ${emp.div}</td>
                    <td class="p-2.5 text-right font-black text-blue-600">${fmt.format(averagePerDay)} / Hari</td>
                    <td class="p-2.5 text-center text-slate-500 font-mono text-[10px]">${emp.masa} Terdaftar</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
